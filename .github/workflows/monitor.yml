name: Monitor Tesla deals

on:
  schedule:
    # Every 4 hours, off the top of the hour (scheduled runs at :00 are often delayed).
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts in the log instead of opening issues"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", "config.toml", "offers.toml", "tracker/**"]

permissions:
  contents: write   # commit price history back to the repo
  issues: write     # open deal alerts / health issues
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    # Tesla blocks GitHub-hosted runners (HTTP 403). Set the repository variable
    # MONITOR_RUNNER to "self-hosted" to run this job on your own machine instead.
    runs-on: ${{ vars.MONITOR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check Tesla inventory and incentives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESLA_PROXY: ${{ secrets.TESLA_PROXY }}
        run: python -m tracker run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit updated history
        run: |
          git config user.name "tesla-deal-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update Tesla deal data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Build dashboard
        run: python -m tracker site --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    # Pages must be enabled once (Settings → Pages → Source: GitHub Actions).
    # Until then this job fails without affecting monitoring or alerts.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Diagnose Tesla access

# Manual diagnostic: shows which request strategies tesla.com accepts from this runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ vars.MONITOR_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m tracker.probe
        env:
          TESLA_PROXY: ${{ secrets.TESLA_PROXY }}
